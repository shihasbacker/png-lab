name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Resolve base path
        id: base_path
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"

          if [[ -n "${{ vars.GH_PAGES_CNAME }}" || "$repo_name" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/$repo_name/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm install

      - name: Build app
        env:
          VITE_BASE_PATH: ${{ steps.base_path.outputs.value }}
        run: npm run build

      - name: Add CNAME
        if: ${{ vars.GH_PAGES_CNAME != '' }}
        run: echo "${{ vars.GH_PAGES_CNAME }}" > apps/web/dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
